name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv
      - name: Install project
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest -q
      - name: Validate demo model
        run: uv run mbse-lite validate projects/demo_project
