[project]
name = "mbse-lite"
version = "0.1.0"
description = "Lightweight text-first MBSE proof of concept"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
cad = [
    "cadquery==2.8.0",
]

[project.scripts]
mbse-lite = "mbse_lite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbse_lite"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
